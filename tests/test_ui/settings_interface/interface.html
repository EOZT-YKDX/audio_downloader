<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>音频下载器</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="framework.css">
    <link rel="stylesheet" href="appearance_and_theme.css">
</head>
<body>
    <div id="appearance_and_theme">
        <h1 class="section_title">外观与主题</h1>
        
        <!-- 主题模式 -->
        <div id="theme_mode_item">
            <!-- 主题模式图标 -->
            <svg viewBox="0 0 24 24" id="theme_mode_icon">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            
            <!-- 主题模式标题 -->
            <div id="theme_mode_title_container">
                <p id="theme_mode_title">主题模式</p>
                <p id="theme_mode_description">选择应用的视觉主题</p>
            </div>
            
            <!-- 主题模式选项 -->
            <div id="theme_mode_options">
                <div>
                    <button class="theme_mode_options_button">
                        <svg viewBox="0 0 24 24" class="theme_mode_options_icon">
                            <rect x="2" y="3" width="20" height="14" rx="2"/>
                            <line x1="8" y1="21" x2="16" y2="21"/>
                            <line x1="12" y1="17" x2="12" y2="21"/>
                        </svg>

                        <p class="theme_mode_options_text">跟随系统</p>
                    </button>
                </div>

                <div>
                    <button class="theme_mode_options_button">
                        <svg viewBox="0 0 24 24" class="theme_mode_options_icon">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>

                        <p class="theme_mode_options_text">浅色主题</p>
                    </button>
                </div>

                <div>
                    <button class="theme_mode_options_button">
                        <svg viewBox="0 0 24 24" class="theme_mode_options_icon">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>

                        <p class="theme_mode_options_text">深色主题</p>
                    </button>
                </div>
            </div>
        </div>

        <!-- 分界线 -->
        <div id="theme_mode_divider"></div>
        
        <div id="theme_mode_divider"></div>

    </div>
</body>
</html>
