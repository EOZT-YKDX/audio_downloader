<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>音频下载器</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="content.css">
    <link rel="stylesheet" href="top_nav.css">
    <link rel="stylesheet" href="left_nav.css">
    <link rel="stylesheet" href="framework.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <div id="top_nav">
        <svg id="top_nav_icon" viewBox="0 0 24 24">
            <line x1="12" y1="15" x2="12" y2="3"></line>
            <polyline points="7 10 12 15 17 10"></polyline>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        </svg>
        
        <p id="top_nav_title">音频下载器</p>
        
        <svg id="top_nav_minimize_button" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <svg id="top_nav_close_button" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </div>

    <!-- 主内容区域（左侧导航 + 右侧内容） -->
    <div id="main_container">
        <!-- 左侧导航栏 -->
        <div id="left_nav">
            <svg viewBox="0 0 24 24" id="left_nav_download_button">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            
            <svg viewBox="0 0 24 24" id="left_nav_task_add_button">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            
            <svg viewBox="0 0 24 24" id="left_nav_settings_button">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </div>

        <!-- 页面内容 -->
        <div id="content">
            <p id="empty_state_message">当前没有下载任务</p>
        </div>
    </div>
</body>
</html>
