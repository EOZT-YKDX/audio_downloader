[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-downloader"
version = "1.0.0"
description = "B站收藏夹音频批量处理工具：并发下载、格式转换、元数据写入、浏览器自动化压缩与桌面图形界面"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "YKDX" }]
requires-python = ">=3.10"
keywords = [
    "bilibili",
    "audio",
    "downloader",
    "you-get",
    "ffmpeg",
    "mutagen",
    "selenium",
    "pywebview",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]

# 依赖依据 src 下的真实 import 声明：
#   requests        → network_client（爬取、压缩文件下载）
#   PyYAML          → config_handler（配置读写与深度合并）
#   mutagen         → metadata_editor / data_processor（标签读写）
#   filetype        → metadata_editor（封面 MIME 嗅探）
#   fake-useragent  → network_client（随机 UA）
#   selenium        → audio_compressor（浏览器自动化；Edge 驱动由 Selenium
#                     Manager 自动下载，无需额外声明 msedgedriver）
#   pywebview       → ui（桌面窗口与 JS 桥接）
#   you-get         → network_client（视频下载，以子进程调用）
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "mutagen>=1.47.0",
    "filetype>=1.2.0",
    "fake-useragent>=1.4.0",
    "selenium>=4.15.0",
    "pywebview>=4.4.0",
    "you-get>=0.4.1700",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.4.0",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/EOZT-YKDX"
Repository = "https://github.com/EOZT-YKDX"
Issues = "https://github.com/EOZT-YKDX/issues"

# 本项目刻意不声明 console_scripts / gui_scripts，原因有二：
#   1. main(fid, output_dir, config) 三个参数均无默认值，须由 src/main.py 的
#      __main__ 块提供，无法直接作为 CLI 入口；
#   2. src/ui/ui_launcher.py 内部使用 "from validators import ..." 这类以
#      src/ui 为根的顶层导入，必须让 src/ui 位于 sys.path，脚本方式启动才成立。
# 启动方式见 README「快速开始」：
#   cd src && python main.py
#   cd src && python ui/ui_launcher.py

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "app_initializer*",
    "audio_compressor*",
    "config_handler*",
    "data_processor*",
    "log_setup*",
    "metadata_editor*",
    "network_client*",
    "stats_generator*",
    "task_executor*",
    "ui*",
]

# UI 前端资源必须随包分发，否则 pywebview 找不到 index.html 与本地化文件
[tool.setuptools.package-data]
ui = [
    "frontend/*.html",
    "frontend/css/*.css",
    "frontend/js/*.js",
    "frontend/locales/*.json",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | __pycache__
  | \.pytest_cache
  | \.ruff_cache
)/
'''

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["__pycache__", ".venv", "build", "dist"]

# ruff >= 0.2 起，规则选择已迁移至 [tool.ruff.lint]
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # 行宽由 black 负责
    "B008",  # 允许在参数默认值中调用函数（本项目大量使用常量注入）
]

[tool.ruff.lint.per-file-ignores]
# __init__.py 通过 __all__ 收敛公开接口，允许「导入但未使用」
"__init__.py" = ["F401", "F403"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 让 tests/ 下可直接 import src.* 包，无需在每个用例里手写 sys.path 操作
pythonpath = ["."]
addopts = "-v --tb=short"